name: Build and Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY_NAME: fundmymeal
  CONTAINER_APP_NAME: app-fundmymeal
  CONTAINER_REGISTRY_URL: fundmymeal.azurecr.io
  IMAGE_NAME: fundmymeal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push Docker image to ACR
        run: |
          az acr build \
            --registry ${{ env.AZURE_CONTAINER_REGISTRY_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group rg-fundmymeal \
            --image ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      - name: Get Container App URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group rg-fundmymeal \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "🎉 App deployed successfully!"
          echo "View at: https://$URL"
          echo "APP_URL=https://$URL" >> $GITHUB_ENV

      - name: Output deployment info
        run: |
          echo "✅ Deployment Complete"
          echo "Image: ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Container App: ${{ env.CONTAINER_APP_NAME }}"
