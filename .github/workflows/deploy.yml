name: Build and Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY_NAME: fundmymeal
  CONTAINER_APP_NAME: app-fundmymeal
  CONTAINER_REGISTRY_URL: fundmymeal.azurecr.io
  IMAGE_NAME: fundmymeal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY_NAME }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group fundmymeal \
            --image ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      - name: Get Container App URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group fundmymeal \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "🎉 App deployed successfully!"
          echo "View at: https://$URL"
          echo "APP_URL=https://$URL" >> $GITHUB_ENV

      - name: Output deployment info
        run: |
          echo "✅ Deployment Complete"
          echo "Image: ${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Container App: ${{ env.CONTAINER_APP_NAME }}"
